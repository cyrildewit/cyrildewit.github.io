baseURL: "https://cyrildewit.github.io/"
title: Cyril de Wit
theme: PaperMod
pagination:
  pagerSize: 10

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
# googleAnalytics: UA-123-45

minify:
  disableXML: true
  # minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives/
          weight: 5
        - name: Search
          url: search/
          weight: 6
        - name: Tags
          url: tags/
          weight: 7
        - name: Projects
          url: projects/
          weight: 8

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Cyril de Wit - https://cyrildewit.github.io/"
  author: Cyril de Wit
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  comments: true
  images: [ "papermod-cover.png" ] # TODO

  profileMode:
    enabled: false
    title: Cyril de Wit
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Cyril de Wit"
    Content: >
      Hi, my name is Cyril, and I am a Software Engineer . I currently work at Chargee 
      
      
      
      Building smart energy solutions at @chargee-energy using TypeScript (Nest.js), PHP (Laravel), gRPC and AWS).
      
      My name is Cyril de Wit and I am a software developer based in Eindhoven, The Netherlands. I am currently working at Edubookers.com. My primary technology stack consists of PHP, Laravel, Vue.js and Tailwind CSS but I like to tinker around with other tools whenever I can. For example Next.js, Flutter, Arduino, C# and Java.
      On the web
  socialIcons:
    - name: github
      url: "https://github.com/cyrildewit"
    - name: linkedIn
      url: "https://www.linkedin.com/in/cyrildewit"
    - name: Rss
      url: "index.xml"


    # editPost:
